name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  # ───────────────────────────────────────────────────────────────
  # Gate job: a red build here BLOCKS deploy (deploy `needs: test`).
  # Runs the Pint style check (free, deterministic) and the PHPUnit
  # suite against a throwaway MySQL 8 service container. The project
  # is MySQL-only — there is no sqlite path — so the DB tests need a
  # real MySQL. The service DB name matches phpunit.xml's
  # DB_DATABASE=temple_portal_test.
  # ───────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: temple_portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, gd, zip, intl, bcmath, sodium, pdo_mysql

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-test-${{ hashFiles('composer.lock', 'composer.json') }}

      # Tests/Pint live in require-dev, so install WITH dev here (the
      # deploy job below still uses --no-dev for production).
      - name: Install Composer dependencies (with dev)
        run: composer install --optimize-autoloader --no-interaction

      # ⚠️ REPORTING MODE (continue-on-error) — does NOT block deploy yet.
      # The existing codebase predates Pint and ~180 files don't match its
      # default ruleset, and the new PHPUnit suite has not yet had a green
      # run against the CI MySQL service. Blocking on either right now would
      # brick every deploy on day one. These steps report results so you can
      # watch them go green, THEN arm the gate:
      #   1. run `vendor/bin/pint` once locally + commit the formatting pass,
      #   2. confirm `php artisan test` is green in a CI run,
      #   3. remove the `continue-on-error: true` lines below so a red build
      #      blocks deploy (the `deploy` job already `needs: test`).
      - name: Check code style (Pint)
        continue-on-error: true
        run: ./vendor/bin/pint --test

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        continue-on-error: true
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: temple_portal_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  # ───────────────────────────────────────────────────────────────
  # Deploy runs ON the VPS via a self-hosted runner (label: vps).
  # The old model — GitHub-hosted runner rsync/ssh-ing INTO the box —
  # died repeatedly on 2026-07-26: the Azure↔Hostinger route to this
  # IP block flaps and times out while every other network reaches
  # port 22 fine. The runner needs only an OUTBOUND connection to
  # GitHub, so that whole class of failure is gone. Build happens on
  # the box (php8.3 + composer + node20 installed), then a LOCAL rsync
  # into /var/www/temple-portal and the same post-deploy script as
  # before, run directly instead of over SSH.
  #
  # Runner: /home/deploy/actions-runner (systemd service, user deploy).
  # Re-register: gh api -X POST repos/webdev-tisblr/temple-portal/actions/runners/registration-token
  # ───────────────────────────────────────────────────────────────
  deploy:
    runs-on: [self-hosted, vps]
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Regenerate autoloader
        run: composer dump-autoload --optimize --no-interaction

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Sync code into the live directory
        # Same exclude list the remote rsync used: --delete never touches
        # .env, storage/app (R2-era leftovers), or runtime caches.
        run: |
          rsync -rlc --checksum --delete \
            --exclude='.git' --exclude='node_modules' --exclude='.env' --exclude='.env.production' --exclude='.env.deploy' --exclude='.env.server' --exclude='tests' --exclude='.github' --exclude='storage/app/public/' --exclude='storage/app/private/' --exclude='storage/app/mpdf/' --exclude='storage/logs/*.log' --exclude='storage/framework/cache/data/*' --exclude='storage/framework/sessions/*' --exclude='storage/framework/views/*' --exclude='database.sqlite' \
            ./ /var/www/temple-portal/

      - name: Post-deploy
        run: |
                    cd /var/www/temple-portal
                    # Abort the deploy on ANY unguarded failure — most importantly a
                    # failed `migrate --force`. Without this, a migration error left
                    # the deploy green while silently blocking every later migration
                    # (2026-07-12 incident: clean_rich_html_content FAIL hid the
                    # missing temple_seva_reminder_rules table). Commands that are
                    # allowed to fail keep their explicit `|| true` guards.
                    set -e
                    # Take a fresh DB snapshot to the offsite r2_backup disk BEFORE
                    # running migrations, so a bad/destructive migration can be
                    # rolled back from the most recent pre-migration dump. Tolerant
                    # of failure (|| true) so a backup hiccup can't block the deploy
                    # entirely — but the snapshot is the safety net for the line below.
                    php artisan backup:run --only-db || true
                    php artisan migrate --force
                    # Idempotent — only inserts rows that don't already exist.
                    # Seeds the per-channel notification templates so triggers
                    # like contact.submitted have a delivery body the moment
                    # the trigger fires.
                    php artisan db:seed --class=Database\\Seeders\\NotificationTemplatesSeeder --force || true
                    # Materialise reminder rows for bookings confirmed before the
                    # pre-computed seva reminder schedule existed. Idempotent
                    # (firstOrCreate on booking+offset) — only has an effect the
                    # first time; harmless on every subsequent deploy. New
                    # confirmations are scheduled automatically via the observer.
                    php artisan seva:backfill-reminder-schedule || true
                    # Re-stamp fire_at for pending full-day/full-week reminders that
                    # were generated with the old midnight anchor (before the
                    # configurable 09:00 anchor landed). Idempotent — recomputes the
                    # same value on subsequent deploys, no effect once corrected.
                    php artisan seva:restamp-fullday-reminders || true
                    # Roles — idempotent via Spatie's firstOrCreate. Without
                    # this, any new role added in code (eg `pujari` in
                    # 2026-05-13) wouldn't exist in production's `roles`
                    # table and the admin-user form wouldn't show it in the
                    # dropdown. Safe to run on every deploy.
                    php artisan db:seed --class=Database\\Seeders\\RolePermissionSeeder --force || true

                    # Filament Shield permission scan — inserts permission rows
                    # for any newly-added Resource / Page / Widget so non-super
                    # admins can be granted access via /admin/shield/roles
                    # without an SSH step. --option=permissions skips policy
                    # file generation so existing app/Policies/* stay untouched;
                    # --all covers resources + pages + widgets in one pass.
                    # Idempotent: only inserts missing rows, preserves all
                    # existing role-permission assignments.
                    php artisan shield:generate --all --option=permissions --minimal --panel=admin || true

                    # Clear ALL caches BEFORE rebuilding them. Filament's
                    # admin-resource registration is computed from class
                    # discovery at boot — without optimize:clear, a newly-added
                    # resource (or a navigationGroup move) is invisible until
                    # the cached bootstrap PHP is regenerated.
                    php artisan optimize:clear
                    php artisan config:cache
                    php artisan route:cache
                    # view:cache races live traffic: the moment view:clear (in
                    # optimize:clear) empties storage/framework/views, FPM
                    # recompiles requested views as www-data, and view:cache
                    # (running as deploy) then can't overwrite those files —
                    # 2026-07-31 deploy failed exactly this way. Sweep any
                    # foreign-owned files first, and on a residual collision
                    # sweep + retry once (the double race is ~impossible).
                    find storage/framework/views -name '*.php' -delete
                    php artisan view:cache || {
                        find storage/framework/views -name '*.php' -delete
                        php artisan view:cache
                    }
                    php artisan filament:cache-components 2>/dev/null || true

                    # VPS: reload PHP-FPM so every worker picks up the new
                    # bytecode at once. Replaces the shared-hosting-era
                    # _opcache_reset.php HTTP hack (8-hit curl fan-out) that
                    # existed because shared hosting exposed no FPM reload.
                    sudo -n systemctl reload php8.3-fpm
                    echo "php-fpm reloaded"

                    # Tell the Supervisor queue workers to exit after their current
                    # job so they respawn on the NEW code. Without this a worker
                    # keeps running old bytecode until its hourly --max-time
                    # recycle — the queue-worker equivalent of the opcache
                    # staleness this same script solves for FPM.
                    php artisan queue:restart
                    echo "queue workers signalled to restart"
                    # storage:link removed — uploads now live in Cloudflare R2,
                    # not storage/app/public, so the public/storage symlink is unused.

                    # Wipe orphaned upload files left over from the pre-R2 era.
                    # Everything in storage/app/{public,private} is now unused;
                    # uploads + generated PDFs live in Cloudflare R2. The
                    # .gitignore in each dir is preserved so the directory itself
                    # stays in place (Laravel still expects it to exist).
                    # Idempotent: subsequent runs are no-ops.
                    find storage/app/public -mindepth 1 -not -name '.gitignore' -delete 2>/dev/null || true
                    find storage/app/private -mindepth 1 -not -name '.gitignore' -delete 2>/dev/null || true
                    # Remove the now-broken public/storage symlink (if present).
                    rm -f public/storage 2>/dev/null || true
