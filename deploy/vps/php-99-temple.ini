; /etc/php/8.3/fpm/conf.d/99-temple.ini
; Apply, then: systemctl reload php8.3-fpm
;
; Rationale (see VPS_MIGRATION_RUNBOOK_2026-07-12.md §2):
;   upload/post sizes → campaign media allows a 10 MB upload (nginx
;   client_max_body_size 12m must agree — it does).
;   memory_limit → GD (greeting cards) + Imagick (darshan share cards) renders.
;   opcache validate_timestamps=1 → normal reloads; the deploy also runs an
;   explicit `systemctl reload php8.3-fpm`, so no 8-hit HTTP opcache hack.

upload_max_filesize = 12M
post_max_size = 14M
memory_limit = 256M
max_execution_time = 60

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
