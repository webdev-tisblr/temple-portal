name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, gd, zip, intl, bcmath

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          # Cache key includes composer.json so changes to autoload (e.g.
          # adding files-autoloaded helpers) bust the cache. composer.lock
          # alone is not enough — its hash doesn't change when only the
          # autoload section of composer.json moves.
          key: composer-${{ hashFiles('composer.lock', 'composer.json') }}

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Regenerate autoloader
        # Belt-and-suspenders: even on a cache hit, force a fresh
        # vendor/composer/autoload_*.php so newly-added helper files
        # in the autoload.files array are always registered.
        run: composer dump-autoload --optimize --no-interaction

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # Hostinger SSH has timed out at the rsync step a couple of times — the
      # first attempt is allowed to fail and we retry once after a short wait.
      # If the second attempt fails too, the job fails as normal.
      - name: Deploy via rsync (attempt 1)
        id: rsync_attempt1
        uses: burnett01/rsync-deployments@7.0.1
        continue-on-error: true
        with:
          # NOTE: storage/app/public/ and storage/app/private/ are excluded so
          # rsync --delete does NOT wipe admin-uploaded images, generated 80G
          # receipts, or hall invoices that only exist on the server.
          # database.sqlite is excluded for the same reason.
          switches: -rlczv --checksum --delete --exclude='.git' --exclude='node_modules' --exclude='.env' --exclude='.env.production' --exclude='.env.deploy' --exclude='.env.server' --exclude='tests' --exclude='.github' --exclude='storage/app/public/' --exclude='storage/app/private/' --exclude='storage/logs/*.log' --exclude='storage/framework/cache/data/*' --exclude='storage/framework/sessions/*' --exclude='storage/framework/views/*' --exclude='database.sqlite'
          path: ./
          remote_path: ~/domains/patadiyahanumanji.com/public_html/
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_port: ${{ secrets.HOSTINGER_PORT }}
          remote_user: ${{ secrets.HOSTINGER_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Wait before retry
        if: steps.rsync_attempt1.outcome == 'failure'
        run: sleep 30

      - name: Deploy via rsync (attempt 2)
        if: steps.rsync_attempt1.outcome == 'failure'
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -rlczv --checksum --delete --exclude='.git' --exclude='node_modules' --exclude='.env' --exclude='.env.production' --exclude='.env.deploy' --exclude='.env.server' --exclude='tests' --exclude='.github' --exclude='storage/app/public/' --exclude='storage/app/private/' --exclude='storage/logs/*.log' --exclude='storage/framework/cache/data/*' --exclude='storage/framework/sessions/*' --exclude='storage/framework/views/*' --exclude='database.sqlite'
          path: ./
          remote_path: ~/domains/patadiyahanumanji.com/public_html/
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_port: ${{ secrets.HOSTINGER_PORT }}
          remote_user: ${{ secrets.HOSTINGER_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run post-deploy commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            cd ~/domains/patadiyahanumanji.com/public_html
            php artisan migrate --force
            # Idempotent — only inserts rows that don't already exist.
            # Seeds the per-channel notification templates so triggers
            # like contact.submitted have a delivery body the moment
            # the trigger fires.
            php artisan db:seed --class=Database\\Seeders\\NotificationTemplatesSeeder --force || true
            # Roles — idempotent via Spatie's firstOrCreate. Without
            # this, any new role added in code (eg `pujari` in
            # 2026-05-13) wouldn't exist in production's `roles`
            # table and the admin-user form wouldn't show it in the
            # dropdown. Safe to run on every deploy.
            php artisan db:seed --class=Database\\Seeders\\RolePermissionSeeder --force || true

            # Clear ALL caches BEFORE rebuilding them. Filament's
            # admin-resource registration is computed from class
            # discovery at boot — without optimize:clear, a newly-added
            # resource (or a navigationGroup move) is invisible until
            # the cached bootstrap PHP is regenerated.
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan filament:cache-components 2>/dev/null || true

            # Reset Hostinger's PHP-OPcache. Without this, new compiled
            # .php files sit on disk but PHP-FPM keeps serving stale
            # bytecode from memory until each worker naturally recycles
            # (can be hours). The one-shot HTTP script trick is the only
            # reliable way on shared hosting because the SSH session and
            # the web SAPI are separate PHP processes with separate
            # OPcaches — clearing from CLI only resets the CLI cache.
            #
            # Hardening notes (added 2026-05-13 after a deploy where stale
            # bytecode kept OtpService returning a removed hardcoded OTP):
            #   • Hit the reset URL 8× with cache-busting query strings
            #     so we round-robin across distinct FPM worker processes.
            #     A single curl only resets the worker that happened to
            #     answer, leaving the rest stale.
            #   • Echo the response body of each hit into the Actions log
            #     so a future failure (OPCACHE_API_BLOCKED, 5xx, etc.) is
            #     visible without SSH.
            #   • A secondary invalidate-by-path pass via CLI hits any
            #     opcache.file_cache on disk (Hostinger uses this on some
            #     plans). Belt-and-suspenders.
            cat > public/_opcache_reset.php << 'PHP'
            <?php
            header('Cache-Control: no-store');
            if (function_exists('opcache_reset')) {
                $ok = opcache_reset();
                echo $ok ? 'OPCACHE_RESET_OK pid=' . getmypid() : 'OPCACHE_RESET_RETURNED_FALSE';
            } else {
                echo 'OPCACHE_API_BLOCKED';
            }
            PHP
            echo "── Web-SAPI opcache reset (8 hits to fan out across FPM workers):"
            for i in 1 2 3 4 5 6 7 8; do
              # Cache-bust query string + Pragma header force fresh execution
              # rather than CDN/proxy reuse on shared hosting.
              response=$(curl -sS --max-time 10 \
                -H 'Pragma: no-cache' \
                "https://patadiyahanumanji.com/_opcache_reset.php?bust=$i&t=$(date +%s%N)" 2>&1 || echo 'CURL_FAILED')
              echo "  hit $i → $response"
            done
            rm -f public/_opcache_reset.php

            # Secondary pass — invalidate-by-path for the file cache on
            # disk (opcache.file_cache, used on some Hostinger plans).
            # Runs in the CLI SAPI which has its own opcache; harmless if
            # not configured.
            echo "── CLI opcache file-cache invalidate (best-effort):"
            php -r "
              if (function_exists('opcache_invalidate')) {
                  \$count = 0;
                  foreach (['app', 'bootstrap', 'config', 'routes'] as \$dir) {
                      \$it = new RecursiveIteratorIterator(new RecursiveDirectoryIterator(\$dir));
                      foreach (\$it as \$file) {
                          if (\$file->isFile() && \$file->getExtension() === 'php') {
                              opcache_invalidate(\$file->getPathname(), true);
                              \$count++;
                          }
                      }
                  }
                  echo \"  invalidated {\$count} files\n\";
              } else {
                  echo \"  opcache_invalidate unavailable\n\";
              }
            " || echo "  CLI invalidate skipped"
            # storage:link removed — uploads now live in Cloudflare R2,
            # not storage/app/public, so the public/storage symlink is unused.

            # Wipe orphaned upload files left over from the pre-R2 era.
            # Everything in storage/app/{public,private} is now unused;
            # uploads + generated PDFs live in Cloudflare R2. The
            # .gitignore in each dir is preserved so the directory itself
            # stays in place (Laravel still expects it to exist).
            # Idempotent: subsequent runs are no-ops.
            find storage/app/public -mindepth 1 -not -name '.gitignore' -delete 2>/dev/null || true
            find storage/app/private -mindepth 1 -not -name '.gitignore' -delete 2>/dev/null || true
            # Remove the now-broken public/storage symlink (if present).
            rm -f public/storage 2>/dev/null || true
