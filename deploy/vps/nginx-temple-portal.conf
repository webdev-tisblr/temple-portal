# /etc/nginx/sites-available/temple-portal
# Symlink into sites-enabled and remove the default:
#   ln -s /etc/nginx/sites-available/temple-portal /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# TLS: the domain is Cloudflare-proxied. Easiest robust setup is a Cloudflare
# Origin Certificate (CF dashboard → SSL/TLS → Origin Server → create, 15yr),
# saved to the paths below, with CF SSL mode = Full (strict). The origin cert
# works BEFORE DNS cutover, which the Phase-D smoke test needs.

server {
    listen 80;
    listen [::]:80;
    server_name patadiyahanumanji.com www.patadiyahanumanji.com;

    # After the origin cert is installed, redirect all HTTP → HTTPS.
    # (Leave this commented until the 443 block below is active, so the
    #  pre-cutover HTTP smoke test still works.)
    # return 301 https://$host$request_uri;

    root /var/www/temple-portal/public;
    index index.php;
    client_max_body_size 12m;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param HTTP_PROXY "";
    }

    # Deny dotfiles except ACME/well-known.
    location ~ /\.(?!well-known) { deny all; }

    # Long-cache the built Vite assets (hashed filenames).
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

