; /etc/supervisor/conf.d/temple-worker.conf
;
; Write this in Phase B but keep it DISABLED (autostart=false) until Phase H.
; On cutover day QUEUE_CONNECTION stays `sync` (identical to today), so there
; is no worker yet. Phase H flips .env to redis, sets autostart=true, then:
;   supervisorctl reread && supervisorctl update && supervisorctl start temple-worker:*
;
; Queues: otp (high priority) drains first, then default, then broadcast.

[program:temple-worker]
command=php /var/www/temple-portal/artisan queue:work redis --queues=otp,default,broadcast --tries=3 --backoff=10 --max-time=3600
directory=/var/www/temple-portal
user=deploy
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=false
autorestart=true
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/temple-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
