name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, gd, zip, intl, bcmath

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          # Cache key includes composer.json so changes to autoload (e.g.
          # adding files-autoloaded helpers) bust the cache. composer.lock
          # alone is not enough — its hash doesn't change when only the
          # autoload section of composer.json moves.
          key: composer-${{ hashFiles('composer.lock', 'composer.json') }}

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Regenerate autoloader
        # Belt-and-suspenders: even on a cache hit, force a fresh
        # vendor/composer/autoload_*.php so newly-added helper files
        # in the autoload.files array are always registered.
        run: composer dump-autoload --optimize --no-interaction

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Deploy only changed files via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # NOTE: storage/app/public/ and storage/app/private/ are excluded so
          # rsync --delete does NOT wipe admin-uploaded images, generated 80G
          # receipts, or hall invoices that only exist on the server.
          # database.sqlite is excluded for the same reason.
          switches: -rlczv --checksum --delete --exclude='.git' --exclude='node_modules' --exclude='.env' --exclude='.env.production' --exclude='.env.deploy' --exclude='.env.server' --exclude='tests' --exclude='.github' --exclude='storage/app/public/' --exclude='storage/app/private/' --exclude='storage/logs/*.log' --exclude='storage/framework/cache/data/*' --exclude='storage/framework/sessions/*' --exclude='storage/framework/views/*' --exclude='database.sqlite'
          path: ./
          remote_path: ~/domains/patadiyahanumanji.com/public_html/
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_port: ${{ secrets.HOSTINGER_PORT }}
          remote_user: ${{ secrets.HOSTINGER_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run post-deploy commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            cd ~/domains/patadiyahanumanji.com/public_html
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link 2>/dev/null || true
